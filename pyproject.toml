[project]
name = "vigileye"
version = "1.0.0"
description = "Agentic go/no-go readiness decisions for pilots from wearable biometrics"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "pandas>=2.2.0",
    "google-cloud-bigquery>=3.25.0",
    "db-dtypes>=1.3.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "google-genai>=0.1.2",
]
ui = [
    "streamlit>=1.38.0",
    "plotly>=5.20.0",
    "httpx>=0.27.0",
    "rapidfuzz>=3.9.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
